<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <mask id="ts-cutout-mask">
      <rect width="500" height="500" fill="white" />
      <text x="200" y="300" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="250" letter-spacing="5" text-anchor="middle" dominant-baseline="central" fill="black">TS</text>
    </mask>

    <clipPath id="outside-circle">
      <path d="M 0 0 L 500 0 L 500 500 A 500 500 0 0 0 0 0 Z" />
